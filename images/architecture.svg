<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="System architecture: React frontend, FastAPI backend, PostgreSQL, SQLite checkpoints, local uploads and Google Gemini">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">System architecture</text>

  <!-- Browser -->
  <rect x="24" y="70" width="230" height="440" rx="14" fill="#eff6ff" stroke="#2563eb"/>
  <text x="139" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Browser</text>
  <text x="139" y="116" text-anchor="middle" font-size="12" fill="#334155">React 19 + Vite SPA</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="44" y="140" width="190" height="64" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="139" y="166" font-weight="700">Home / Login / Register</text>
    <text x="139" y="184">role chosen at sign-up</text>
    <rect x="44" y="226" width="190" height="64" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="139" y="252" font-weight="700">Instructor dashboard</text>
    <text x="139" y="270">rubric JSON, PDF upload, grades</text>
    <rect x="44" y="312" width="190" height="64" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="139" y="338" font-weight="700">TA dashboard</text>
    <text x="139" y="356">review queue, page viewer</text>
    <rect x="44" y="398" width="190" height="64" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="139" y="424" font-weight="700">axios client</text>
    <text x="139" y="442">httpOnly cookie session</text>
  </g>

  <!-- Backend -->
  <rect x="330" y="70" width="400" height="440" rx="14" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="530" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">FastAPI backend</text>
  <text x="530" y="116" text-anchor="middle" font-size="12" fill="#334155">backend/app/main.py</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="350" y="140" width="360" height="56" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="530" y="164" font-weight="700">Routers: register, login, users, exams, upload</text>
    <text x="530" y="182">JWT in httpOnly cookie, Argon2 password hashing</text>
    <rect x="350" y="212" width="360" height="56" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="530" y="236" font-weight="700">Upload handler</text>
    <text x="530" y="254">saves PDF, rasterizes pages, queues background task</text>
    <rect x="350" y="284" width="360" height="72" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="530" y="308" font-weight="700">LangGraph workflow (ai_engine/graph.py)</text>
    <text x="530" y="326">OCR, grading, metrics, human-review interrupt</text>
    <text x="530" y="344">resumes when the TA submits a review</text>
    <rect x="350" y="372" width="170" height="64" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="435" y="398" font-weight="700">Reliability model</text>
    <text x="435" y="416">13 features, RandomForest</text>
    <rect x="540" y="372" width="170" height="64" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="625" y="398" font-weight="700">Plagiarism check</text>
    <text x="625" y="416">embeddings + LLM judge</text>
    <rect x="350" y="452" width="360" height="40" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="530" y="477">BackgroundTasks run grading inside the web process</text>
  </g>

  <!-- Storage -->
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="810" y="70" width="266" height="86" rx="14" fill="#ecfdf5" stroke="#059669"/>
    <text x="943" y="100" font-size="15" font-weight="700" fill="#047857">PostgreSQL</text>
    <text x="943" y="122">users, exams (rubric JSON),</text>
    <text x="943" y="138">submissions (status, score)</text>

    <rect x="810" y="176" width="266" height="86" rx="14" fill="#ecfdf5" stroke="#059669"/>
    <text x="943" y="206" font-size="15" font-weight="700" fill="#047857">Local disk: uploads/</text>
    <text x="943" y="228">PDFs, page PNGs,</text>
    <text x="943" y="244">plagiarism.json per exam</text>

    <rect x="810" y="282" width="266" height="86" rx="14" fill="#ecfdf5" stroke="#059669"/>
    <text x="943" y="312" font-size="15" font-weight="700" fill="#047857">SQLite checkpoints.db</text>
    <text x="943" y="334">paused LangGraph state, one thread</text>
    <text x="943" y="350">per submission</text>

    <rect x="810" y="400" width="266" height="110" rx="14" fill="#fff7ed" stroke="#ea580c"/>
    <text x="943" y="430" font-size="15" font-weight="700" fill="#c2410c">Google Gemini API</text>
    <text x="943" y="452">vision OCR, rubric grading,</text>
    <text x="943" y="468">embeddings, pair adjudication</text>
    <text x="943" y="490" fill="#9a3412">student work leaves the system</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M254 430 L330 430"/>
    <path d="M730 168 L808 112"/>
    <path d="M730 238 L808 219"/>
    <path d="M730 320 L808 325"/>
    <path d="M730 400 L808 440"/>
  </g>
  <text x="292" y="422" text-anchor="middle" font-size="11" fill="#475569">HTTPS</text>
</svg>
