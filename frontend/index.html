<body>
  <div class="wrap">
    <div class="hero">
      <div class="card">
        <div class="pill">Prototype scaffold</div>

        <div class="stack">
          <label>Student PDF <input id="studentFile" type="file" accept="application/pdf" /></label>
          <label>Rubric JSON <input id="rubricFile" type="file" accept="application/json" /></label>
          <label>Split mode <select id="mode"><option value="auto">Auto split</option><option value="manual">Manual split</option></select></label>
          <button id="uploadBtn">Upload files</button>
          <button id="sampleBtn" type="button">Load sample output</button>
        </div>
        <div id="manualPanel" class="manual-panel" hidden>
          <h3>Manual question splitting</h3>
          <p class="muted">Click each place where a new question begins. Red lines show your split points.</p>
          <div id="pageTabs" class="page-tabs"></div>
          <div id="pagePreview" class="page-preview"><img id="pageImage" alt="Uploaded exam page" /></div>
          <p id="clickSummary" class="muted"></p>
          <div class="manual-controls">
            <button id="clearClicksBtn" class="secondary" type="button">Clear current page</button>
            <button id="splitManualBtn" type="button">Save splits and continue</button>

          <li>Flag low-confidence answers for human review</li>
        </ol>
      </div>
    </div>
    <div class="grid">
      <div class="card"><h3>Session</h3><pre id="sessionBox">No session yet.</pre></div>
      <div class="card"><h3>Split / Extract / Grade</h3><pre id="resultBox">Use the buttons above to start the prototype.</pre></div>
      <div class="card"><h3>Sample JSON</h3><pre id="sampleBox">Click load sample output to see the target JSON format.</pre></div>

  <script>
    const sessionBox = document.getElementById("sessionBox");
    const resultBox = document.getElementById("resultBox");
    const sampleBox = document.getElementById("sampleBox");
    const uploadBtn = document.getElementById("uploadBtn");
    const sampleBtn = document.getElementById("sampleBtn");
    const manualPanel = document.getElementById("manualPanel");
    const pageTabs = document.getElementById("pageTabs");
    const pagePreview = document.getElementById("pagePreview");
    const pageImage = document.getElementById("pageImage");
    const clickSummary = document.getElementById("clickSummary");
    const clearClicksBtn = document.getElementById("clearClicksBtn");
    const splitManualBtn = document.getElementById("splitManualBtn");
    let sessionId = null;
    let currentPageIndex = 0;
    let manualClicks = [];

    async function callJson(url, options = {}) {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(body.detail || `Request failed with status ${response.status}`);
      }
      return body;
    }

    function setBusy(button, busy) {
      button.disabled = busy;
      button.textContent = busy ? "Working..." : button.dataset.label;
    }

    function renderClickLines() {
      pagePreview.querySelectorAll(".boundary-line").forEach((line) => line.remove());
      const pageClicks = manualClicks.filter((click) => click.page_index === currentPageIndex);
      const displayHeight = pageImage.clientHeight;
      const naturalHeight = pageImage.naturalHeight;
      if (!displayHeight || !naturalHeight) return;
      pageClicks.forEach((click) => {
        const line = document.createElement("div");
        line.className = "boundary-line";
        line.style.top = `${(click.y / naturalHeight) * displayHeight}px`;
        pagePreview.appendChild(line);
      });
      clickSummary.textContent = `${pageClicks.length} split point${pageClicks.length === 1 ? "" : "s"} on page ${currentPageIndex + 1}.`;
    }

    function showPage(pageIndex) {
      currentPageIndex = pageIndex;
      pageImage.src = `/api/sessions/${sessionId}/pages/${pageIndex}`;
      pageTabs.querySelectorAll("button").forEach((button, index) => {
        button.classList.toggle("secondary", index !== pageIndex);
      });
    }

    function setUpManualSplit(count) {
      currentPageIndex = 0;
      manualClicks = [];
      pageTabs.innerHTML = "";
      for (let index = 0; index < count; index += 1) {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.textContent = `Page ${index + 1}`;
        tab.addEventListener("click", () => showPage(index));
        pageTabs.appendChild(tab);
      }
      manualPanel.hidden = false;
      showPage(0);
    }

    async function runPipeline() {
      resultBox.textContent = "Splitting pages...";
      const split = await callJson(`/api/sessions/${sessionId}/split`, { method: "POST" });
      resultBox.textContent = "Extracting text and regions...";
      const extract = await callJson(`/api/sessions/${sessionId}/extract`, { method: "POST" });
      resultBox.textContent = "Grading answers...";
      const grade = await callJson(`/api/sessions/${sessionId}/grade`, { method: "POST" });
      resultBox.textContent = JSON.stringify({ split, extract, grade }, null, 2);
    }

    uploadBtn.addEventListener("click", async () => {
      const studentFile = document.getElementById("studentFile").files[0];
      const rubricFile = document.getElementById("rubricFile").files[0];
      const mode = document.getElementById("mode").value;
      if (!studentFile || !rubricFile) {
        resultBox.textContent = "Please choose both files first.";
        return;
      }
      setBusy(uploadBtn, true);
      try {
        const form = new FormData();
        form.append("student_file", studentFile);
        form.append("rubric_file", rubricFile);
        form.append("mode", mode);
        resultBox.textContent = "Uploading and rendering PDF pages...";
        const upload = await callJson("/api/upload", { method: "POST", body: form });
        sessionId = upload.session_id;
        const session = await callJson(`/api/sessions/${sessionId}`);
        sessionBox.textContent = JSON.stringify(session, null, 2);
        if (mode === "manual") {
          setUpManualSplit(session.page_paths.length);
          resultBox.textContent = "Add split points to each page, then choose Save splits and continue.";
        } else {
          manualPanel.hidden = true;
          await runPipeline();
        }
      } catch (error) {
        resultBox.textContent = `Upload failed: ${error.message}`;
      } finally {
        setBusy(uploadBtn, false);
      }
    });

    pageImage.addEventListener("load", renderClickLines);
    pageImage.addEventListener("click", (event) => {
      const bounds = pageImage.getBoundingClientRect();
      const y = Math.round(((event.clientY - bounds.top) / bounds.height) * pageImage.naturalHeight);
      const x = Math.round(((event.clientX - bounds.left) / bounds.width) * pageImage.naturalWidth);
      manualClicks.push({ page_index: currentPageIndex, x, y });
      renderClickLines();
    });

    clearClicksBtn.addEventListener("click", () => {
      manualClicks = manualClicks.filter((click) => click.page_index !== currentPageIndex);
      renderClickLines();
    });

    splitManualBtn.addEventListener("click", async () => {
      if (!sessionId) return;
      setBusy(splitManualBtn, true);
      try {
        resultBox.textContent = "Saving manual split points...";
        await callJson(`/api/sessions/${sessionId}/manual-clicks`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(manualClicks),
        });
        await runPipeline();
      } catch (error) {
        resultBox.textContent = `Manual split failed: ${error.message}`;
      } finally {
        setBusy(splitManualBtn, false);
      }
    });

    [uploadBtn, splitManualBtn].forEach((button) => {
      button.dataset.label = button.textContent;
    });

    sampleBtn.addEventListener("click", async () => {
      const sample = await callJson("/api/sample-output");
      sampleBox.textContent = JSON.stringify(sample, null, 2);
    });
  </script>
</body>-->
